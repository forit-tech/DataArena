[project]
name = "dataarena"
version = "0.1.0"
description = "Локальная рабочая среда для табличных данных: просмотр, SQL, диагностика, преобразования, сборка и экспорт датасетов."
requires-python = ">=3.12,<3.14"
dependencies = [
    # верхние границы заданы по minor, а не по major: в AutoDataAnalysis граница "<4.0"
    # для pandas оказалась настолько широкой, что установилась major-версия, которой
    # на момент написания границы не существовало, и воспроизводимость исчезла.
    "duckdb>=1.5,<1.6",
    "fastapi>=0.141,<0.142",
    # starlette приходит с FastAPI, но закреплена явно: в 0.47.3 было шесть известных
    # уязвимостей, и без нижней границы установка легко откатилась бы на неё
    "starlette>=1.3.1,<2.0",
    "fastexcel>=0.20,<0.21",
    "numpy>=2.4,<3.0",
    "polars>=1.43,<1.44",
    "pyarrow>=24,<25",
    "pydantic>=2.12,<3.0",
    "python-multipart>=0.0.20,<0.1",
    "uvicorn[standard]>=0.35,<0.40",
    "xlsxwriter>=3.2,<4.0",
    # на Windows у zoneinfo нет системной базы часовых поясов: без tzdata колонки
    # с часовым поясом роняют фильтры и приведение типов ошибкой 500
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "jsonschema>=4.26,<5.0",
    "mypy>=2.3,<3.0",
    #измерение памяти диагностики: tracemalloc не видит буферы Arrow и печатал
    #«пик 0,0 МБ» там, где процесс занимал гигабайт
    "psutil>=7.1,<8.0",
    "pytest>=9.0,<10.0",
    #CI гоняет pytest с --cov: без этой зависимости прогон падал на неизвестном
    #аргументе, то есть main был красным, а манифест об этом не знал
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ARG", "PIE", "PL", "BLE", "SLF"]
ignore = [
    # RUF001-003 срабатывают на кириллице в строках и комментариях, а интерфейс проекта русскоязычный
    "RUF001",
    "RUF002",
    "RUF003",
    # B008 неизбежен в FastAPI: File(...) и Form(...) по контракту вызываются в значениях по умолчанию
    "B008",
    # локальные импорты используются осознанно: тяжёлые библиотеки грузятся лениво
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
# в тестах допустимы assert, «магические» числа и длинные фикстуры
# S608: сборка враждебного SQL из строк — предмет проверки в тестах безопасности,
# а не недосмотр: именно так выглядит запрос, который к нам придёт
"tests/*" = ["S101", "PLR2004", "ARG001", "E501", "SLF001", "S608"]
# сквозная проверка обращается к собственному серверу на 127.0.0.1 и сравнивает коды
# ответа: превращать 200 и 201 в именованные константы здесь значит ухудшить читаемость
"scripts/*" = ["S310", "PLR2004"]
# побайтовая копия эталонной реализации отпечатка из docs/contracts/reference.
# Править её нельзя: совпадение с эталоном проверяется тестом и есть доказательство того,
# что DataArena собирает пакеты по тому же контракту, который публикует
"backend/adapters/package/fingerprint.py" = ["PLR0911", "PLR2004", "N806", "E501"]
# математическое ядро Decision Lab: формулы TOPSIS и анализа устойчивости естественно
# принимают матрицу, веса, направления, seed и число сценариев. Упаковка их в объекты
# ради правила о числе аргументов ухудшила бы сверку кода с формулами в
# docs/research/MATHEMATICAL_MODEL.md. random.Random здесь — воспроизводимый генератор
# сценариев по seed, а не криптография (S311)
"backend/domain/decision/*" = ["PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "S311"]

[tool.mypy]
# версия не фиксируется: mypy берёт её у интерпретатора, под которым запущен
packages = ["backend"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# та же побайтовая копия: она написана под эталон, а не под настройки этого проекта
module = "backend.adapters.package.fingerprint"
ignore_errors = true
